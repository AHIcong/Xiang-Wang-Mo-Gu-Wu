<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小H去哪儿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: #f5f0e6;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            position: relative;
            background: linear-gradient(180deg, #87CEEB 0%, #E8F5E9 40%, #90EE90 100%);
            overflow: hidden;
        }

        /* 首页 - 院子场景 */
        #home-page {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 天空和云朵 */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            animation: float 20s infinite linear;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 { width: 80px; height: 30px; top: 8%; left: 10%; }
        .cloud1::before { width: 40px; height: 40px; top: -20px; left: 10px; }
        .cloud1::after { width: 50px; height: 35px; top: -15px; left: 30px; }

        .cloud2 { width: 60px; height: 25px; top: 15%; left: 60%; animation-delay: -10s; }
        .cloud2::before { width: 35px; height: 35px; top: -18px; left: 8px; }
        .cloud2::after { width: 40px; height: 30px; top: -12px; left: 25px; }

        @keyframes float {
            0% { transform: translateX(0); }
            100% { transform: translateX(430px); }
        }

        /* 骨头数量显示 */
        #bone-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 25px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .bone-icon {
            font-size: 24px;
        }

        #bone-num {
            font-size: 20px;
            font-weight: bold;
            color: #8B691E;
        }

        /* 相册入口 */
        #album-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 100;
            transition: transform 0.2s;
        }
        #album-btn:active { transform: scale(0.9); }

        /* 地面 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, #7CB342 0%, #558B2F 100%);
            border-radius: 50% 50% 0 0 / 20px 20px 0 0;
        }

        /* 蘑菇屋 */
        .mushroom-house {
            position: absolute;
            bottom: 25%;
            right: 5%;
            width: 120px;
            height: 120px;
        }
        .mushroom-cap {
            width: 100px;
            height: 60px;
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .mushroom-cap::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            top: 15px;
            left: 20px;
            opacity: 0.8;
        }
        .mushroom-cap::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            top: 25px;
            right: 25px;
            opacity: 0.6;
        }
        .mushroom-stem {
            width: 60px;
            height: 50px;
            background: linear-gradient(180deg, #FFF8E7 0%, #F5E6D3 100%);
            margin: -5px auto 0;
            border-radius: 0 0 10px 10px;
            position: relative;
        }
        .door {
            width: 25px;
            height: 30px;
            background: #8B691E;
            border-radius: 12px 12px 0 0;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 骨头摊 */
        #bone-stall {
            position: absolute;
            bottom: 30%;
            left: 8%;
            width: 70px;
            height: 70px;
            cursor: pointer;
            z-index: 50;
            transition: transform 0.2s;
        }
        #bone-stall:active { transform: scale(0.9); }

        .stall-table {
            width: 60px;
            height: 8px;
            background: #8B691E;
            border-radius: 4px;
            position: absolute;
            bottom: 20px;
            left: 5px;
        }
        .stall-leg {
            width: 6px;
            height: 20px;
            background: #6B4E1E;
            position: absolute;
            bottom: 0;
        }
        .stall-leg.left { left: 10px; }
        .stall-leg.right { right: 10px; }

        .stall-bone {
            position: absolute;
            top: 5px;
            font-size: 28px;
            animation: bone-bounce 1s infinite;
        }
        .stall-bone:nth-child(4) { left: 10px; animation-delay: 0s; }
        .stall-bone:nth-child(5) { left: 30px; animation-delay: 0.3s; }

        @keyframes bone-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* 小H角色 */
        #xiaoh-character {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            z-index: 60;
            transition: all 0.5s ease;
        }

        .xiaoh-body {
            width: 80px;
            height: 70px;
            background: linear-gradient(180deg, #F5A623 0%, #E8941F 100%);
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
            border: 3px solid #5D3A1A;
        }

        .xiaoh-face {
            position: absolute;
            width: 50px;
            height: 35px;
            background: #FFF8E7;
            border-radius: 50%;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid #5D3A1A;
        }

        .xiaoh-eye {
            width: 8px;
            height: 10px;
            background: #5D3A1A;
            border-radius: 50%;
            position: absolute;
            top: 8px;
        }
        .xiaoh-eye.left { left: 12px; }
        .xiaoh-eye.right { right: 12px; }

        .xiaoh-nose {
            width: 10px;
            height: 8px;
            background: #FF6B6B;
            border-radius: 50%;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .xiaoh-mouth {
            width: 20px;
            height: 10px;
            border: 2px solid #5D3A1A;
            border-top: none;
            border-radius: 0 0 20px 20px;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .xiaoh-ear {
            width: 20px;
            height: 25px;
            background: linear-gradient(180deg, #F5A623 0%, #E8941F 100%);
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -15px;
            border: 3px solid #5D3A1A;
            border-bottom: none;
        }
        .xiaoh-ear.left { left: 5px; transform: rotate(-15deg); }
        .xiaoh-ear.right { right: 5px; transform: rotate(15deg); }

        .xiaoh-ear-inner {
            width: 12px;
            height: 18px;
            background: #FFD4A3;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .xiaoh-tail {
            width: 25px;
            height: 25px;
            background: linear-gradient(180deg, #F5A623 0%, #E8941F 100%);
            border-radius: 50%;
            position: absolute;
            right: -10px;
            top: 20px;
            border: 2px solid #5D3A1A;
            animation: tail-wag 2s infinite;
        }

        @keyframes tail-wag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
        }

        /* 小H状态动画 */
        .xiaoh-idle {
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); }
        }

        .xiaoh-running {
            animation: run 0.5s infinite;
        }

        @keyframes run {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            25% { transform: translateX(-50%) translateY(-10px) rotate(-5deg); }
            75% { transform: translateX(-50%) translateY(-5px) rotate(5deg); }
        }

        .xiaoh-away {
            opacity: 0;
            transform: translateX(-50%) translateX(200px) !important;
            transition: all 1s ease;
        }

        /* 出发按钮 */
        #go-btn {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 50px;
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(238, 90, 90, 0.4);
            z-index: 100;
            transition: all 0.2s;
        }
        #go-btn:active { transform: translateX(-50%) scale(0.95); }
        #go-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 状态提示 */
        #status-text {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 14px;
            color: #5D3A1A;
            z-index: 100;
        }

        /* 飘字动画 */
        .float-text {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #F5A623;
            pointer-events: none;
            animation: float-up 1s ease-out forwards;
            z-index: 200;
        }

        @keyframes float-up {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 出发弹窗 */
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #5D3A1A;
            margin-bottom: 20px;
        }

        /* 便当选择 */
        .bento-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .bento-card {
            width: 130px;
            padding: 15px;
            border: 2px solid #E8D5B7;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            background: #FFF8E7;
        }
        .bento-card:hover { border-color: #F5A623; }
        .bento-card.selected {
            border-color: #FF6B6B;
            background: #FFF0F0;
        }
        .bento-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bento-icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .bento-name {
            font-size: 16px;
            font-weight: bold;
            color: #5D3A1A;
            margin-bottom: 4px;
        }
        .bento-cost {
            font-size: 14px;
            color: #8B691E;
        }
        .bento-time {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .bento-reward {
            font-size: 12px;
            color: #4CAF50;
            margin-top: 2px;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary {
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            color: white;
        }
        .modal-btn.secondary {
            background: #f0f0f0;
            color: #666;
            margin-top: 10px;
        }
        .modal-btn:disabled {
            background: #ccc !important;
            cursor: not-allowed;
        }

        /* 进度条页面 */
        #progress-page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .progress-xiaoh {
            font-size: 80px;
            margin-bottom: 30px;
            animation: run-bounce 0.6s infinite;
        }

        @keyframes run-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-10deg); }
        }

        .progress-text {
            font-size: 18px;
            color: #5D3A1A;
            margin-bottom: 20px;
        }

        .progress-destination {
            font-size: 16px;
            color: #8B691E;
            margin-bottom: 30px;
        }

        .progress-bar-container {
            width: 80%;
            height: 20px;
            background: #E8D5B7;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FF6B6B 0%, #F5A623 100%);
            border-radius: 10px;
            transition: width 1s linear;
        }

        .progress-time {
            font-size: 24px;
            font-weight: bold;
            color: #FF6B6B;
        }

        /* 途中照片弹窗 */
        .photo-modal .modal-content {
            padding: 20px;
        }
        .photo-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }
        .photo-xiaoh {
            font-size: 50px;
            position: absolute;
            bottom: 20px;
        }
        .photo-text {
            font-size: 16px;
            color: #5D3A1A;
            margin-bottom: 15px;
        }

        /* 归来弹窗 - 明信片 */
        .postcard-modal .modal-content {
            background: linear-gradient(180deg, #FFF8E7 0%, #FFF 100%);
            padding: 0;
            overflow: hidden;
        }
        .postcard-header {
            background: linear-gradient(180deg, #FF6B6B 0%, #EE5A5A 100%);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .postcard-image {
            width: 100%;
            height: 220px;
            position: relative;
            overflow: hidden;
        }
        .postcard-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .postcard-xiaoh {
            position: absolute;
            font-size: 60px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        .postcard-content {
            padding: 20px;
        }
        .postcard-text {
            font-size: 16px;
            color: #5D3A1A;
            line-height: 1.6;
            margin-bottom: 15px;
            font-style: italic;
        }
        .postcard-guest {
            font-size: 14px;
            color: #8B691E;
            margin-bottom: 15px;
            padding: 10px;
            background: #FFF8E7;
            border-radius: 10px;
        }
        .postcard-reward {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #F5A623;
            margin-bottom: 15px;
        }
        .postcard-buttons {
            display: flex;
            gap: 10px;
        }
        .postcard-buttons .modal-btn {
            flex: 1;
        }

        /* 相册页面 */
        #album-page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            background: #f5f0e6;
        }

        .album-header {
            background: linear-gradient(180deg, #5B8C5A 0%, #4A7A4A 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .album-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .album-title {
            font-size: 22px;
            font-weight: bold;
        }
        .album-count {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 5px;
        }

        .album-grid {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .album-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .album-item:active { transform: scale(0.95); }

        .album-item-img {
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
        }
        .album-item-xiaoh {
            position: absolute;
            font-size: 35px;
            bottom: 10px;
        }
        .album-item-info {
            padding: 10px;
        }
        .album-item-dest {
            font-size: 14px;
            font-weight: bold;
            color: #5D3A1A;
        }
        .album-item-date {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* 空相册提示 */
        .album-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .album-empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .album-empty-text {
            font-size: 16px;
        }

        /* 大图查看 */
        .photo-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
        }
        .photo-viewer.active { display: flex; }
        .viewer-image {
            width: 90%;
            max-width: 400px;
            height: 300px;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
            margin-bottom: 20px;
        }
        .viewer-xiaoh {
            position: absolute;
            font-size: 60px;
            bottom: 30px;
        }
        .viewer-text {
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        .viewer-close {
            color: white;
            font-size: 30px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            border-radius: 50%;
        }

        /* 小O角色 */
        .xiao-o {
            position: absolute;
            bottom: 22%;
            right: 20%;
            width: 60px;
            height: 60px;
            z-index: 55;
            opacity: 0.9;
        }
        .xiao-o-body {
            width: 50px;
            height: 45px;
            background: linear-gradient(180deg, #FFF 0%, #F5F5F5 100%);
            border-radius: 50%;
            position: relative;
            border: 2px solid #5D3A1A;
        }
        .xiao-o-ear {
            width: 15px;
            height: 18px;
            background: #FFF;
            border-radius: 50% 50% 0 0;
            position: absolute;
            top: -10px;
            border: 2px solid #5D3A1A;
            border-bottom: none;
        }
        .xiao-o-ear.left { left: 5px; transform: rotate(-10deg); }
        .xiao-o-ear.right { right: 5px; transform: rotate(10deg); }
        .xiao-o-spot {
            width: 12px;
            height: 12px;
            background: #5D3A1A;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            right: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 首页 -->
        <div id="home-page">
            <!-- 云朵 -->
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

            <!-- UI -->
            <div id="album-btn">📷</div>
            <div id="bone-counter">
                <span class="bone-icon">🦴</span>
                <span id="bone-num">20</span>
            </div>

            <!-- 场景 -->
            <div class="ground"></div>

            <!-- 蘑菇屋 -->
            <div class="mushroom-house">
                <div class="mushroom-cap"></div>
                <div class="mushroom-stem">
                    <div class="door"></div>
                </div>
            </div>

            <!-- 骨头摊 -->
            <div id="bone-stall">
                <div class="stall-bone">🦴</div>
                <div class="stall-bone">🦴</div>
                <div class="stall-table"></div>
                <div class="stall-leg left"></div>
                <div class="stall-leg right"></div>
            </div>

            <!-- 小O -->
            <div class="xiao-o" id="xiao-o">
                <div class="xiao-o-body">
                    <div class="xiao-o-ear left"></div>
                    <div class="xiao-o-ear right"></div>
                    <div class="xiao-o-spot"></div>
                </div>
            </div>

            <!-- 小H -->
            <div id="xiaoh-character" class="xiaoh-idle">
                <div class="xiaoh-body">
                    <div class="xiaoh-ear left"><div class="xiaoh-ear-inner"></div></div>
                    <div class="xiaoh-ear right"><div class="xiaoh-ear-inner"></div></div>
                    <div class="xiaoh-face">
                        <div class="xiaoh-eye left"></div>
                        <div class="xiaoh-eye right"></div>
                        <div class="xiaoh-nose"></div>
                        <div class="xiaoh-mouth"></div>
                    </div>
                    <div class="xiaoh-tail"></div>
                </div>
            </div>

            <!-- 状态提示 -->
            <div id="status-text">小H在家发呆中...</div>

            <!-- 出发按钮 -->
            <button id="go-btn">🎒 出发探险</button>
        </div>

        <!-- 进度条页面 -->
        <div id="progress-page">
            <div class="progress-xiaoh">🐕</div>
            <div class="progress-text">小H正在探险中...</div>
            <div class="progress-destination" id="progress-dest">目的地：田野</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
            </div>
            <div class="progress-time" id="progress-time">剩余 60秒</div>
        </div>

        <!-- 相册页面 -->
        <div id="album-page">
            <div class="album-header">
                <div class="album-back" id="album-back">←</div>
                <div class="album-title">📷 明信片相册</div>
                <div class="album-count" id="album-count">已收集 0 张</div>
            </div>
            <div class="album-grid" id="album-grid">
                <div class="album-empty">
                    <div class="album-empty-icon">📭</div>
                    <div class="album-empty-text">还没有明信片哦~<br>快让小H出发探险吧！</div>
                </div>
            </div>
        </div>

        <!-- 出发弹窗 -->
        <div class="modal-overlay" id="go-modal">
            <div class="modal-content">
                <div class="modal-title">🎒 给小H准备便当</div>
                <div class="bento-options">
                    <div class="bento-card" data-type="snack" data-cost="5" data-time="60" data-reward="10-15">
                        <div class="bento-icon">🍖</div>
                        <div class="bento-name">小零食</div>
                        <div class="bento-cost">🦴 5 骨头</div>
                        <div class="bento-time">⏱ 1分钟</div>
                        <div class="bento-reward">💰 带回 10-15</div>
                    </div>
                    <div class="bento-card" data-type="normal" data-cost="15" data-time="180" data-reward="25-35">
                        <div class="bento-icon">🍱</div>
                        <div class="bento-name">普通便当</div>
                        <div class="bento-cost">🦴 15 骨头</div>
                        <div class="bento-time">⏱ 3分钟</div>
                        <div class="bento-reward">💰 带回 25-35</div>
                    </div>
                </div>
                <button class="modal-btn primary" id="confirm-go">出发！</button>
                <button class="modal-btn secondary" id="cancel-go">再想想</button>
            </div>
        </div>

        <!-- 途中照片弹窗 -->
        <div class="modal-overlay photo-modal" id="photo-modal">
            <div class="modal-content">
                <div class="photo-image" id="photo-img">
                    <span style="font-size:80px">🏞️</span>
                    <span class="photo-xiaoh">🐕</span>
                </div>
                <div class="photo-text" id="photo-text">小H发回了一张途中照片！</div>
                <button class="modal-btn primary" id="photo-ok">继续等待</button>
            </div>
        </div>

        <!-- 归来弹窗 - 明信片 -->
        <div class="modal-overlay postcard-modal" id="postcard-modal">
            <div class="modal-content">
                <div class="postcard-header">📮 小H寄来明信片！</div>
                <div class="postcard-image" id="postcard-img">
                    <span style="font-size:100px" id="postcard-bg-emoji">🌾</span>
                    <span class="postcard-xiaoh">🐕</span>
                </div>
                <div class="postcard-content">
                    <div class="postcard-text" id="postcard-text">今天的田野好大，跑了好久~</div>
                    <div class="postcard-guest" id="postcard-guest">💬 何老师："看到小H跑那么开心，我也开心呀~"</div>
                    <div class="postcard-reward">
                        <span>🦴</span>
                        <span id="reward-num">+12</span>
                    </div>
                    <div class="postcard-buttons">
                        <button class="modal-btn primary" id="collect-reward">领取奖励</button>
                        <button class="modal-btn secondary" id="share-postcard">分享</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 大图查看器 -->
        <div class="photo-viewer" id="photo-viewer">
            <div class="viewer-image" id="viewer-img">
                <span style="font-size:100px" id="viewer-bg">🌾</span>
                <span class="viewer-xiaoh">🐕</span>
            </div>
            <div class="viewer-text" id="viewer-text">今天的田野好大，跑了好久~</div>
            <div class="viewer-close" id="viewer-close">✕</div>
        </div>
    </div>

    <script>
        // ==================== 游戏数据 ====================
        const DESTINATIONS = {
            field: { name: '田野', emoji: '🌾', bg: 'linear-gradient(180deg, #87CEEB 0%, #90EE90 100%)' },
            river: { name: '河边', emoji: '🌊', bg: 'linear-gradient(180deg, #87CEEB 0%, #4FC3F7 100%)' },
            neighbor: { name: '邻居家', emoji: '🏠', bg: 'linear-gradient(180deg, #FFE0B2 0%, #FFCC80 100%)' },
            market: { name: '集市', emoji: '🏪', bg: 'linear-gradient(180deg, #FFCDD2 0%, #EF9A9A 100%)' }
        };

        const POSTCARDS = {
            field: [
                { text: '今天的田野好大，跑了好久~', emoji: '🌾' },
                { text: '累了，躺一会儿...', emoji: '🌾' }
            ],
            river: [
                { text: '河里的自己好帅呀', emoji: '🌊' },
                { text: '哇！抓到了！', emoji: '🌊' }
            ],
            neighbor: [
                { text: '那几只鸡好肥...', emoji: '🏠' },
                { text: '交到新朋友啦！', emoji: '🏠' }
            ],
            market: [
                { text: '口水都要流下来了', emoji: '🏪' },
                { text: '这个好漂亮！', emoji: '🏪' }
            ]
        };

        const GUEST_COMMENTS = [
            '何老师："看到小H跑那么开心，我也开心呀~"',
            '黄大厨："回来啦！给你做好吃的！"',
            '彭小哥："小H你跑得比我还快！"'
        ];

        // ==================== 游戏状态 ====================
        let gameState = {
            bones: 20,
            xiaohStatus: 'home', // home / away / return
            currentTrip: null,
            album: [],
            boneSpawnTimer: null,
            tripTimer: null,
            progressInterval: null,
            selectedBento: null
        };

        // ==================== DOM元素 ====================
        const el = {
            boneNum: document.getElementById('bone-num'),
            goBtn: document.getElementById('go-btn'),
            statusText: document.getElementById('status-text'),
            xiaoh: document.getElementById('xiaoh-character'),
            boneStall: document.getElementById('bone-stall'),
            goModal: document.getElementById('go-modal'),
            photoModal: document.getElementById('photo-modal'),
            postcardModal: document.getElementById('postcard-modal'),
            progressPage: document.getElementById('progress-page'),
            homePage: document.getElementById('home-page'),
            albumPage: document.getElementById('album-page'),
            albumBtn: document.getElementById('album-btn'),
            albumBack: document.getElementById('album-back'),
            albumGrid: document.getElementById('album-grid'),
            albumCount: document.getElementById('album-count'),
            confirmGo: document.getElementById('confirm-go'),
            cancelGo: document.getElementById('cancel-go'),
            bentoCards: document.querySelectorAll('.bento-card'),
            progressBar: document.getElementById('progress-bar'),
            progressTime: document.getElementById('progress-time'),
            progressDest: document.getElementById('progress-dest'),
            photoOk: document.getElementById('photo-ok'),
            collectReward: document.getElementById('collect-reward'),
            sharePostcard: document.getElementById('share-postcard'),
            photoViewer: document.getElementById('photo-viewer'),
            viewerClose: document.getElementById('viewer-close')
        };

        // ==================== 工具函数 ====================
        function updateBoneDisplay() {
            el.boneNum.textContent = gameState.bones;
        }

        function showFloatText(x, y, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.textContent = text;
            floatEl.style.left = x + 'px';
            floatEl.style.top = y + 'px';
            document.getElementById('game-container').appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1000);
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // ==================== 骨头摊 ====================
        let boneSpawnInterval;

        function startBoneSpawning() {
            boneSpawnInterval = setInterval(() => {
                // 骨头摊自动刷新动画
                const bones = el.boneStall.querySelectorAll('.stall-bone');
                bones.forEach(b => {
                    b.style.animation = 'none';
                    setTimeout(() => b.style.animation = '', 10);
                });
            }, 30000);
        }

        el.boneStall.addEventListener('click', (e) => {
            if (gameState.xiaohStatus !== 'home') return;

            gameState.bones += 1;
            updateBoneDisplay();

            const rect = el.boneStall.getBoundingClientRect();
            const containerRect = document.getElementById('game-container').getBoundingClientRect();
            showFloatText(
                rect.left - containerRect.left + rect.width / 2,
                rect.top - containerRect.top,
                '+1 🦴'
            );
        });

        // ==================== 出发逻辑 ====================
        el.goBtn.addEventListener('click', () => {
            if (gameState.xiaohStatus === 'away') {
                showFloatText(window.innerWidth / 2, window.innerHeight * 0.7, '小H已经出门啦！');
                return;
            }
            if (gameState.xiaohStatus === 'return') {
                showFloatText(window.innerWidth / 2, window.innerHeight * 0.7, '先领取奖励吧！');
                return;
            }

            // 重置选择
            gameState.selectedBento = null;
            el.bentoCards.forEach(card => card.classList.remove('selected', 'disabled'));
            el.confirmGo.disabled = true;

            // 检查骨头是否足够
            el.bentoCards.forEach(card => {
                const cost = parseInt(card.dataset.cost);
                if (gameState.bones < cost) {
                    card.classList.add('disabled');
                }
            });

            el.goModal.classList.add('active');
        });

        // 便当选择
        el.bentoCards.forEach(card => {
            card.addEventListener('click', () => {
                if (card.classList.contains('disabled')) {
                    showFloatText(window.innerWidth / 2, window.innerHeight * 0.5, '骨头不够哦！');
                    return;
                }

                el.bentoCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                gameState.selectedBento = {
                    type: card.dataset.type,
                    cost: parseInt(card.dataset.cost),
                    time: parseInt(card.dataset.time),
                    reward: card.dataset.reward
                };
                el.confirmGo.disabled = false;
            });
        });

        // 取消出发
        el.cancelGo.addEventListener('click', () => {
            el.goModal.classList.remove('active');
        });

        // 确认出发
        el.confirmGo.addEventListener('click', () => {
            if (!gameState.selectedBento) return;

            const bento = gameState.selectedBento;

            // 扣除骨头
            gameState.bones -= bento.cost;
            updateBoneDisplay();

            // 选择目的地
            const destKeys = Object.keys(DESTINATIONS);
            const destKey = randomChoice(destKeys);
            const destination = DESTINATIONS[destKey];

            // 生成奖励
            const [minReward, maxReward] = bento.reward.split('-').map(Number);
            const reward = randomInt(minReward, maxReward);

            // 选择明信片
            const postcards = POSTCARDS[destKey];
            const postcard = randomChoice(postcards);

            // 选择嘉宾评论
            const guestComment = randomChoice(GUEST_COMMENTS);

            // 保存行程
            gameState.currentTrip = {
                destination: destKey,
                destName: destination.name,
                destEmoji: destination.emoji,
                destBg: destination.bg,
                time: bento.time,
                reward: reward,
                postcard: postcard,
                guestComment: guestComment,
                startTime: Date.now(),
                photoShown: false
            };

            // 更新状态
            gameState.xiaohStatus = 'away';
            el.goBtn.disabled = true;
            el.goBtn.textContent = '🚶 已出门';
            el.statusText.textContent = '小H去' + destination.name + '探险了...';

            // 小H出门动画
            el.xiaoh.classList.remove('xiaoh-idle');
            el.xiaoh.classList.add('xiaoh-away');

            el.goModal.classList.remove('active');

            // 切换到进度页面
            setTimeout(() => {
                el.homePage.style.display = 'none';
                el.progressPage.style.display = 'flex';
                startProgress();
            }, 1000);
        });

        // ==================== 进度条逻辑 ====================
        function startProgress() {
            const trip = gameState.currentTrip;
            const totalTime = trip.time * 1000; // 毫秒
            const photoTime = totalTime * 0.33; // 33%触发照片
            let photoTriggered = false;

            el.progressDest.textContent = '目的地：' + trip.destName;

            const startTime = Date.now();

            gameState.progressInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, totalTime - elapsed);
                const progress = ((elapsed / totalTime) * 100);

                el.progressBar.style.width = progress + '%';
                el.progressTime.textContent = '剩余 ' + Math.ceil(remaining / 1000) + '秒';

                // 33%触发途中照片
                if (!photoTriggered && elapsed >= photoTime && elapsed < photoTime + 1000) {
                    photoTriggered = true;
                    showPhotoModal();
                }

                // 完成
                if (remaining <= 0) {
                    clearInterval(gameState.progressInterval);
                    setTimeout(() => {
                        el.progressPage.style.display = 'none';
                        showReturnModal();
                    }, 500);
                }
            }, 100);
        }

        // ==================== 途中照片弹窗 ====================
        function showPhotoModal() {
            const trip = gameState.currentTrip;
            document.getElementById('photo-img').style.background = trip.destBg;
            el.photoModal.classList.add('active');
        }

        el.photoOk.addEventListener('click', () => {
            el.photoModal.classList.remove('active');
        });

        // ==================== 归来弹窗 ====================
        function showReturnModal() {
            const trip = gameState.currentTrip;

            // 设置明信片内容
            document.getElementById('postcard-bg-emoji').textContent = trip.destEmoji;
            document.getElementById('postcard-img').style.background = trip.destBg;
            document.getElementById('postcard-text').textContent = trip.postcard.text;
            document.getElementById('postcard-guest').textContent = '💬 ' + trip.guestComment;
            document.getElementById('reward-num').textContent = '+' + trip.reward;

            el.postcardModal.classList.add('active');

            // 更新状态
            gameState.xiaohStatus = 'return';
        }

        // 领取奖励
        el.collectReward.addEventListener('click', () => {
            const trip = gameState.currentTrip;

            // 加骨头
            gameState.bones += trip.reward;
            updateBoneDisplay();

            // 添加到相册
            const albumItem = {
                id: Date.now(),
                destination: trip.destName,
                emoji: trip.destEmoji,
                bg: trip.destBg,
                text: trip.postcard.text,
                date: new Date().toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };
            gameState.album.push(albumItem);

            // 保存到localStorage
            saveGame();

            // 关闭弹窗
            el.postcardModal.classList.remove('active');

            // 恢复首页
            el.homePage.style.display = 'flex';
            el.xiaoh.classList.remove('xiaoh-away');
            el.xiaoh.classList.add('xiaoh-idle');
            el.goBtn.disabled = false;
            el.goBtn.textContent = '🎒 出发探险';
            el.statusText.textContent = '小H在家发呆中...';

            gameState.xiaohStatus = 'home';
            gameState.currentTrip = null;

            showFloatText(window.innerWidth / 2, window.innerHeight * 0.5, '欢迎回家！🦴 +' + trip.reward);
        });

        // 分享
        el.sharePostcard.addEventListener('click', () => {
            const trip = gameState.currentTrip;
            const shareText = `【小H去哪儿】小H从${trip.destName}寄来明信片："${trip.postcard.text}" 🐕🦴`;

            if (navigator.share) {
                navigator.share({
                    title: '小H去哪儿',
                    text: shareText
                });
            } else {
                // 复制到剪贴板
                navigator.clipboard.writeText(shareText).then(() => {
                    showFloatText(window.innerWidth / 2, window.innerHeight * 0.5, '已复制分享文案！');
                });
            }
        });

        // ==================== 相册系统 ====================
        el.albumBtn.addEventListener('click', () => {
            renderAlbum();
            el.homePage.style.display = 'none';
            el.progressPage.style.display = 'none';
            el.albumPage.style.display = 'flex';
        });

        el.albumBack.addEventListener('click', () => {
            el.albumPage.style.display = 'none';
            if (gameState.xiaohStatus === 'away') {
                el.progressPage.style.display = 'flex';
            } else {
                el.homePage.style.display = 'flex';
            }
        });

        function renderAlbum() {
            el.albumCount.textContent = `已收集 ${gameState.album.length} 张`;

            if (gameState.album.length === 0) {
                el.albumGrid.innerHTML = `
                    <div class="album-empty">
                        <div class="album-empty-icon">📭</div>
                        <div class="album-empty-text">还没有明信片哦~<br>快让小H出发探险吧！</div>
                    </div>
                `;
                return;
            }

            el.albumGrid.innerHTML = gameState.album.map(item => `
                <div class="album-item" data-id="${item.id}">
                    <div class="album-item-img" style="background: ${item.bg}">
                        <span style="font-size:50px">${item.emoji}</span>
                        <span class="album-item-xiaoh">🐕</span>
                    </div>
                    <div class="album-item-info">
                        <div class="album-item-dest">${item.destination}</div>
                        <div class="album-item-date">${item.date}</div>
                    </div>
                </div>
            `).join('');

            // 点击查看大图
            document.querySelectorAll('.album-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = parseInt(item.dataset.id);
                    const albumItem = gameState.album.find(a => a.id === id);
                    if (albumItem) {
                        showPhotoViewer(albumItem);
                    }
                });
            });
        }

        function showPhotoViewer(item) {
            document.getElementById('viewer-bg').textContent = item.emoji;
            document.getElementById('viewer-img').style.background = item.bg;
            document.getElementById('viewer-text').textContent = item.text;
            el.photoViewer.classList.add('active');
        }

        el.viewerClose.addEventListener('click', () => {
            el.photoViewer.classList.remove('active');
        });

        // ==================== 存档系统 ====================
        function saveGame() {
            localStorage.setItem('xiaoh_game', JSON.stringify({
                bones: gameState.bones,
                album: gameState.album
            }));
        }

        function loadGame() {
            const saved = localStorage.getItem('xiaoh_game');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.bones = data.bones || 20;
                gameState.album = data.album || [];
                updateBoneDisplay();
            }
        }

        // ==================== 初始化 ====================
        loadGame();
        startBoneSpawning();

        // 防止页面滚动
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('#game-container')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
